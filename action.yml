name: 'musl cross-compiler'
description: 'Installs musl cross-compiler into PATH'
inputs:
  target:
    description: 'Target triple'
    required: true
  variant:
    description: 'The variant (source repository) you wish to download'
    required: true
    default: 'richfelker/musl-cross-make'
  build:
    description: 'Build instead of download?'
    required: false
    default: false
outputs:
  path:
    description: 'The directory where the binaries are (also added to PATH)'
  directory:
    description: 'Alias of `path`'
runs:
  using: 'node24'
  main: 'index.js'
